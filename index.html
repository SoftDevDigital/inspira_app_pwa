<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <title>Inspira - Tu Plataforma de Crecimiento Personal</title>

    <!-- ===================== PWA ===================== -->
    <meta name="description" content="Inspira: tu comunidad exclusiva de crecimiento personal y liderazgo. Audios, libros, eventos y rutas de éxito, incluso sin conexión." />

    <!-- Manifest -->
    <link rel="manifest" href="/manifest.json" />

    <!-- Color del tema (barra del navegador / sistema) -->
    <meta name="theme-color" content="#ff8c00" />
    <meta name="background-color" content="#000000" />

    <!-- Android / Chrome -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="Inspira" />

    <!-- iOS / Safari: comportarse como app instalada -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Inspira" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="152x152" href="/icons/icon-152x152.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="/icons/icon-192x192.png" />

    <!-- Favicons -->
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192x192.png" />

    <!-- iOS splash: usa background_color del manifest + icono -->
    <meta name="format-detection" content="telephone=no" />
    <!-- =============================================== -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
